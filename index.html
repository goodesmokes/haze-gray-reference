function fileToCompressedDataUrl(file, maxDim = 480, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not load image"));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function Gauge({ value, label }) {
  const v = Math.min(5, Math.max(1, Number(value) || 1));
  const cx = 60, cy = 62, r = 44;
  const angle = -90 + ((v - 1) / 4) * 180;
  const nx2 = cx - r * 0.78 * Math.sin((90 - angle) * Math.PI / 180);
  const ny2 = cy - r * 0.78 * Math.cos((90 - angle) * Math.PI / 180);
  const ticks = [1, 2, 3, 4, 5].map((t) => {
    const ta = (-90 + ((t - 1) / 4) * 180 - 90) * Math.PI / 180;
    return {
      x1: cx + (r + 2) * Math.cos(ta), y1: cy + (r + 2) * Math.sin(ta),
      x2: cx + (r - 6) * Math.cos(ta), y2: cy + (r - 6) * Math.sin(ta), t,
    };
  });
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
      <svg viewBox="0 0 120 72" width="120" height="72">
        <path d={`M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`} fill="none" stroke="#454b53" strokeWidth="8" strokeLinecap="round" />
        {ticks.map((tk, i) => (
          <line key={i} x1={tk.x1} y1={tk.y1} x2={tk.x2} y2={tk.y2} stroke="#B8894C" strokeWidth="2" />
        ))}
        <line x1={cx} y1={cy} x2={nx2} y2={ny2} stroke="#A8402E" strokeWidth="3" strokeLinecap="round" />
        <circle cx={cx} cy={cy} r="5" fill="#B8894C" stroke="#14161A" strokeWidth="1.5" />
      </svg>
      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 20, color: "#EDE6D6", letterSpacing: 1, marginTop: -14 }}>{v}/5</div>
      <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: 11, letterSpacing: 3, color: "#8A93A0", textTransform: "uppercase" }}>{label}</div>
    </div>
  );
}

function parseMoney(str) {
  if (!str) return null;
  const match = String(str)
    .replace(/,/g, "")
    .match(/\$\s*([0-9]+(?:\.[0-9]{1,2})?)/);

  return match ? parseFloat(match[1]) : null;
}

function getNumericPrice(size, key) {
  if (size?.pricing && typeof size.pricing[key] === "number") {
    return size.pricing[key];
  }

  const fallbackMap = {
    msrp: "msrp",
    box10: "keystoneBox10",
    box20: "keystoneBox20",
    bundle20: "keystoneBundle20"
  };

  const oldField = fallbackMap[key];

  return oldField ? parseMoney(size?.[oldField]) : null;
}

function getSinglePrice(size, type) {
  if (size?.pricing) {
    if (
      type === "box" &&
      typeof size.pricing.boxSingle === "number"
    ) {
      return size.pricing.boxSingle;
    }

    if (
      type === "bundle" &&
      typeof size.pricing.bundleSingle === "number"
    ) {
      return size.pricing.bundleSingle;
    }
  }

  const text = String(size?.keystoneSingle || "");

  if (type === "box") {
    const match = text.match(
      /\$\s*([0-9]+(?:\.[0-9]{1,2})?)\s*box/i
    );
    return match ? Number(match[1]) : null;
  }

  if (type === "bundle") {
    const match = text.match(
      /\$\s*([0-9]+(?:\.[0-9]{1,2})?)\s*bundle/i
    );
    return match ? Number(match[1]) : null;
  }

  return null;
}

function computePackageMargins(size) {
  const msrp = getNumericPrice(size, "msrp");

  if (msrp == null || msrp <= 0) return null;

  const packages = [];

  const box10 = getNumericPrice(size, "box10");

  if (box10 != null && box10 > 0) {
    const retailValue = msrp * 10;
    const grossProfit = retailValue - box10;

    packages.push({
      key: "box10",
      label: "10ct Box",
      cost: box10,
      retailValue,
      grossProfit,
      marginPct: (grossProfit / retailValue) * 100,
      perStickCost: box10 / 10,
      perStickProfit: msrp - box10 / 10
    });
  }

  const box20 = getNumericPrice(size, "box20");

  if (box20 != null && box20 > 0) {
    const retailValue = msrp * 20;
    const grossProfit = retailValue - box20;

    packages.push({
      key: "box20",
      label: "20ct Box",
      cost: box20,
      retailValue,
      grossProfit,
      marginPct: (grossProfit / retailValue) * 100,
      perStickCost: box20 / 20,
      perStickProfit: msrp - box20 / 20
    });
  }

  const bundle20 = getNumericPrice(size, "bundle20");

  if (bundle20 != null && bundle20 > 0) {
    const retailValue = msrp * 20;
    const grossProfit = retailValue - bundle20;

    packages.push({
      key: "bundle20",
      label: "20ct Bundle",
      cost: bundle20,
      retailValue,
      grossProfit,
      marginPct: (grossProfit / retailValue) * 100,
      perStickCost: bundle20 / 20,
      perStickProfit: msrp - bundle20 / 20
    });
  }

  return packages.length ? packages : null;
}

              <button className="hg-btn" onClick={() => doDelete(confirmDeleteId)} style={{
                background: "#A8402E", border: "none", color: "#EDE6D6", borderRadius: 4, padding: "8px 14px", fontFamily: "'Oswald', sans-serif", fontSize: 13,
              }}>Delete</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const rootEl = document.getElementById("root");
createRoot(rootEl).render(<HazeGrayReference />);
</script>
</body>
</html>
