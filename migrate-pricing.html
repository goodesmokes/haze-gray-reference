<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haze Gray Pricing Migration</title>
  <style>
    body {
      background: #14161A;
      color: #EDE6D6;
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      color: #E7C79A;
    }

    input, button {
      padding: 10px 12px;
      margin: 5px;
      font-size: 15px;
    }

    button {
      cursor: pointer;
    }

    #log {
      background: #0d0f12;
      border: 1px solid #454b53;
      padding: 15px;
      margin-top: 20px;
      white-space: pre-wrap;
      min-height: 200px;
      font-family: monospace;
    }

    .warning {
      color: #ffcc66;
      margin: 20px 0;
    }
  </style>
</head>
<body>

<h1>Haze Gray Pricing Migration</h1>

<p>
  This utility adds numeric pricing maps to each cigar size while preserving
  the existing pricing strings.
</p>

<p class="warning">
  Run DRY RUN first. Only run MIGRATE after reviewing the preview.
</p>

<div>
  <input id="email" type="email" placeholder="Authorized email" />
  <input id="password" type="password" placeholder="Password" />
  <button id="loginBtn">Sign In</button>
</div>

<div style="margin-top:20px;">
  <button id="dryRunBtn" disabled>Dry Run</button>
  <button id="migrateBtn" disabled>Migrate Pricing</button>
</div>

<div id="log">Waiting...</div>

<script type="module">

import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword
} from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyDYzcHxcQNKUzoJWp4Jd2c67DAvc51N1Pk",
  authDomain: "haze-gray-cigars.firebaseapp.com",
  projectId: "haze-gray-cigars",
  storageBucket: "haze-gray-cigars.firebasestorage.app",
  messagingSenderId: "691261212011",
  appId: "1:691261212011:web:34ad8434b4a1c6f1dbb82e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const logEl = document.getElementById("log");
const dryRunBtn = document.getElementById("dryRunBtn");
const migrateBtn = document.getElementById("migrateBtn");

function log(message) {
  logEl.textContent += "\n" + message;
}

function moneyNumber(value) {
  if (!value) return null;

  const match = String(value)
    .replace(/,/g, "")
    .match(/\$\s*([0-9]+(?:\.[0-9]{1,2})?)/);

  return match ? Number(match[1]) : null;
}

function parseSinglePricing(value) {
  if (!value) {
    return {
      boxSingle: null,
      bundleSingle: null
    };
  }

  const text = String(value);

  const boxMatch =
    text.match(/\$\s*([0-9]+(?:\.[0-9]{1,2})?)\s*box/i);

  const bundleMatch =
    text.match(/\$\s*([0-9]+(?:\.[0-9]{1,2})?)\s*bundle/i);

  return {
    boxSingle: boxMatch ? Number(boxMatch[1]) : null,
    bundleSingle: bundleMatch ? Number(bundleMatch[1]) : null
  };
}

function createPricing(size) {

  const singles = parseSinglePricing(size.keystoneSingle);

  return {
    msrp: moneyNumber(size.msrp),
    box10: moneyNumber(size.keystoneBox10),
    box20: moneyNumber(size.keystoneBox20),
    bundle20: moneyNumber(size.keystoneBundle20),
    boxSingle: singles.boxSingle,
    bundleSingle: singles.bundleSingle
  };
}

async function getCigars() {
  const snapshot = await getDocs(collection(db, "cigars"));

  return snapshot.docs.map(d => ({
    id: d.id,
    ref: d.ref,
    ...d.data()
  }));
}

async function dryRun() {

  logEl.textContent = "DRY RUN\n";

  const cigars = await getCigars();

  let sizeCount = 0;

  for (const cigar of cigars) {

    log(`\n${cigar.name || cigar.id}`);

    const sizes = Array.isArray(cigar.sizes)
      ? cigar.sizes
      : [];

    for (const size of sizes) {

      sizeCount++;

      const pricing = createPricing(size);

      log(
        `  ${size.vitola || size.key}\n` +
        `    MSRP: ${pricing.msrp}\n` +
        `    Box10: ${pricing.box10}\n` +
        `    Box20: ${pricing.box20}\n` +
        `    Bundle20: ${pricing.bundle20}\n` +
        `    Box Single: ${pricing.boxSingle}\n` +
        `    Bundle Single: ${pricing.bundleSingle}`
      );
    }
  }

  log(`\nChecked ${cigars.length} cigars and ${sizeCount} sizes.`);
  log("\nNO DATA WAS CHANGED.");
}

async function migrate() {

  const confirmation = confirm(
    "This will update every cigar document by adding numeric pricing maps. Existing pricing fields will remain untouched. Continue?"
  );

  if (!confirmation) return;

  logEl.textContent = "MIGRATION STARTED\n";

  const cigars = await getCigars();

  let cigarCount = 0;
  let sizeCount = 0;

  for (const cigar of cigars) {

    const originalSizes = Array.isArray(cigar.sizes)
      ? cigar.sizes
      : [];

    const updatedSizes = originalSizes.map(size => {

      sizeCount++;

      return {
        ...size,
        pricing: createPricing(size)
      };
    });

    await updateDoc(
      doc(db, "cigars", cigar.id),
      {
        sizes: updatedSizes
      }
    );

    cigarCount++;

    log(`Updated: ${cigar.name || cigar.id}`);
  }

  log(
    `\nMigration complete.\n` +
    `${cigarCount} cigar documents updated.\n` +
    `${sizeCount} size records updated.`
  );

  log("\nExisting pricing strings were preserved.");
}

document
  .getElementById("loginBtn")
  .addEventListener("click", async () => {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    logEl.textContent = "Signing in...";

    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      logEl.textContent =
        "Signed in successfully.\nRun DRY RUN first.";

      dryRunBtn.disabled = false;
      migrateBtn.disabled = false;

    } catch (error) {

      logEl.textContent =
        "Sign-in failed:\n" + error.message;
    }
  });

dryRunBtn.addEventListener("click", dryRun);
migrateBtn.addEventListener("click", migrate);

</script>

</body>
</html>
